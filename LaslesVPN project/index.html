<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@300..900&display=swap"
      rel="stylesheet"
    />
    <title>VPN</title>
  </head>

  <body>
    <header class="header">
      <div class="container-small">
        <div class="header__nav">
          <img src="./img/Logo.svg" alt="" />
          <ul class="header__nav-list">
            <li class="header__nav-item"><a class="header__nav-link" href="#about">About</a></li>
            <li class="header__nav-item"><a class="header__nav-link" href="#features">Features</a></li>
            <li class="header__nav-item"><a class="header__nav-link" href="#pricing">Pricing</a></li>
            <li class="header__nav-item"><a class="header__nav-link" href="#testimonials">Testimonials</a></li>
            <li class="header__nav-item"><a class="header__nav-link" href="#help">Help</a></li>
          </ul>
          <div class="header__button">
            <a class="header__button__link" href="#">Sign In</a>
            <a class="header__button__link--accent" href="#">Sign Up</a>
          </div>
        </div>
        <div class="container-big">
          <div class="header__content-container">
            <div class="header__content">
              <h1 class="header__title">
                Want anything to be easy with
                <span class="header__title-accent">LaslesVPN.</span>
              </h1>
              <p class="header__text">
                Provide a network for all your needs with ease and fun using
                <span class="header__text-accent">LaslesVPN</span> discover interesting features from us.
              </p>
              <button type="button">Get Started</button>
            </div>
            <img src="./img/header-img.png" alt="" />
          </div>
        </div>
      </div>
    </header>
  </body>
</html>
